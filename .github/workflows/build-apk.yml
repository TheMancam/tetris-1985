name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android Project
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          mkdir -p www
          cp index.html www/
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f icon.svg ]; then cp icon.svg www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.retro.tetris1985",appName:"Tetris 1985",webDir:"www"}))'
          npx cap add android
          node -e 'const fs=require("fs"),p="android/app/src/main/AndroidManifest.xml";const s=fs.readFileSync(p,"utf8");if(!s.includes("screenOrientation"))fs.writeFileSync(p,s.replace("<activity","<activity android:screenOrientation=\"portrait\""));'
          npx cap sync android

      - name: Set up Python (for the app icon)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install app icon
        run: |
          if [ ! -f icon-foreground.png ] || [ ! -f icon-background.png ] || [ ! -f icon.png ]; then
            echo "Icon files not found, keeping the default icon"; exit 0
          fi
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          res = "android/app/src/main/res"
          dens = {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}
          fg = Image.open("icon-foreground.png").convert("RGBA")
          bg = Image.open("icon-background.png").convert("RGBA")
          full = Image.open("icon.png").convert("RGBA")
          for d, s in dens.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              a, l = round(108 * s), round(48 * s)
              fg.resize((a, a), Image.LANCZOS).save(f"{folder}/ic_launcher_foreground.png")
              bg.resize((a, a), Image.LANCZOS).convert("RGB").save(f"{folder}/ic_launcher_background.png")
              icon = full.resize((l, l), Image.LANCZOS)
              icon.save(f"{folder}/ic_launcher.png")
              m = Image.new("L", (l, l), 0)
              ImageDraw.Draw(m).ellipse((0, 0, l - 1, l - 1), fill=255)
              r = Image.new("RGBA", (l, l), (0, 0, 0, 0))
              r.paste(icon, (0, 0), m)
              r.save(f"{folder}/ic_launcher_round.png")
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '  <background android:drawable="@mipmap/ic_launcher_background"/>\n'
                 '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(f"{res}/mipmap-anydpi-v26/{n}", "w") as f:
                  f.write(xml)
          print("App icon installed")
          PY

      - name: Use fixed signing key (so new APKs update the old app)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.android
          # keep only real base64 characters, so stray spaces/line breaks from pasting don't break it
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > ~/.android/debug.keystore
          size=$(stat -c %s ~/.android/debug.keystore)
          if [ "$size" != "2666" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 looks incomplete (decoded $size bytes, expected 2666). Paste the whole key text again."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-1985-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
