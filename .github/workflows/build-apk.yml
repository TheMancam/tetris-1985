name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android Project
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          mkdir -p www
          cp index.html www/
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f icon.svg ]; then cp icon.svg www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.retro.tetris1985",appName:"Tetris 1985",webDir:"www"}))'
          npx cap add android
          node -e 'const fs=require("fs"),p="android/app/src/main/AndroidManifest.xml";const s=fs.readFileSync(p,"utf8");if(!s.includes("screenOrientation"))fs.writeFileSync(p,s.replace("<activity","<activity android:screenOrientation=\"portrait\""));'
          npx cap sync android

      - name: Set up Python (for the app icon)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Draw and install the app icon (retro terminal)
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core > /dev/null 2>&1 || true
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFilter, ImageFont, ImageChops

          S = 1024
          BRIGHT, DIM = (53, 255, 105), (29, 148, 60)


          def font(size):
              for p in ("/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf",
                        "/usr/share/fonts/truetype/liberation/LiberationMono-Bold.ttf"):
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)
              return ImageFont.load_default(size=size)


          def vgrad(w, h, top, bottom):
              g = Image.linear_gradient("L").resize((w, h))
              return Image.composite(Image.new("RGB", (w, h), bottom), Image.new("RGB", (w, h), top), g)


          def rmask(w, h, box, r):
              m = Image.new("L", (w, h), 0)
              ImageDraw.Draw(m).rounded_rectangle(box, r, fill=255)
              return m


          def radial(size, inner, outer):
              g = Image.radial_gradient("L").resize((size, size))
              return Image.composite(Image.new("RGB", (size, size), outer), Image.new("RGB", (size, size), inner), g)


          def background():
              bg = vgrad(S, S, (11, 26, 14), (3, 8, 5)).convert("RGBA")
              glow = Image.new("RGBA", (S, S), BRIGHT + (0,))
              a = Image.radial_gradient("L").resize((1120, 1120)).point(lambda v: int(max(0, 255 - v) * 0.28))
              am = Image.new("L", (S, S), 0)
              am.paste(a, (512 - 560, 470 - 560))
              glow.putalpha(am)
              bg = Image.alpha_composite(bg, glow)
              desk = vgrad(S, S - 760, (26, 20, 12), (10, 8, 5)).convert("RGBA")
              bg.paste(desk, (0, 760))
              return bg


          def terminal():
              fg = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              MX, MY, MW, MH = 282, 268, 460, 390

              # drop shadow
              sh = Image.new("L", (S, S), 0)
              ImageDraw.Draw(sh).rounded_rectangle((MX, MY + 18, MX + MW, MY + MH + 18), 34, fill=150)
              sh = sh.filter(ImageFilter.GaussianBlur(20))
              fg = Image.alpha_composite(fg, Image.merge("RGBA", (*Image.new("RGB", (S, S), (0, 0, 0)).split(), sh)))

              # beige housing
              housing = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              housing.paste(vgrad(MW, MH, (228, 220, 196), (169, 159, 132)), (MX, MY))
              fg.paste(housing, (0, 0), rmask(S, S, (MX, MY, MX + MW, MY + MH), 34))
              d = ImageDraw.Draw(fg)
              d.rounded_rectangle((MX + 4, MY + 4, MX + MW - 4, MY + MH - 4), 30, outline=(255, 255, 255, 140), width=5)
              for i in range(7):
                  d.rounded_rectangle((MX + 150 + i * 24, MY + 18, MX + 162 + i * 24, MY + 22), 2, fill=(60, 50, 35, 115))

              # deep bezel
              SX, SY, SW, SH = MX + 46, MY + 46, MW - 92, 262
              bez = vgrad(SW + 36, SH + 36, (92, 85, 69), (44, 40, 31))
              fg.paste(bez, (SX - 18, SY - 18), rmask(SW + 36, SH + 36, (0, 0, SW + 35, SH + 35), 26))
              d.rounded_rectangle((SX - 18, SY - 18, SX + SW + 18, SY + SH + 18), 26, outline=(255, 255, 255, 64), width=3)

              # CRT glass with the game on it
              scr = radial(SW, (15, 51, 23), (2, 6, 3)).resize((SW, SH)).convert("RGBA")
              txt = Image.new("RGBA", (SW, SH), (0, 0, 0, 0))
              f = font(34)
              rows = [("<!  [][][]  !>", BRIGHT), ("<!    []    !>", BRIGHT), ("<! .  .  .  !>", DIM),
                      ("<![]      []!>", BRIGHT), ("<![][]  [][]!>", BRIGHT), ("<!==========!>", DIM)]
              cw = f.getlength("0")
              lh = 34 * 1.02
              tw = cw * 14
              tx = (SW - tw) / 2
              ty = (SH - len(rows) * lh) / 2
              td = ImageDraw.Draw(txt)
              for i, (t, c) in enumerate(rows):
                  td.text((tx, ty + i * lh), t, font=f, fill=c + (255,))
              scr = Image.alpha_composite(scr, txt.filter(ImageFilter.GaussianBlur(7)))
              scr = Image.alpha_composite(scr, txt.filter(ImageFilter.GaussianBlur(2)))
              scr = Image.alpha_composite(scr, txt)
              sd = ImageDraw.Draw(scr)
              for y in range(0, SH, 4):
                  sd.line((0, y, SW, y), fill=(0, 0, 0, 77), width=1)
              glare = Image.new("L", (SW, SH), 0)
              ImageDraw.Draw(glare).ellipse((int(SW * -0.15), int(SH * -0.12), int(SW * 0.75), int(SH * 0.52)), fill=40)
              glare = glare.filter(ImageFilter.GaussianBlur(30))
              scr = Image.alpha_composite(scr, Image.merge("RGBA", (*Image.new("RGB", (SW, SH), (255, 255, 255)).split(), glare)))
              vig = Image.radial_gradient("L").resize((SW, SH)).point(lambda v: int(max(0, v - 120) * 1.1))
              scr = Image.alpha_composite(scr, Image.merge("RGBA", (*Image.new("RGB", (SW, SH), (0, 0, 0)).split(), vig)))
              fg.paste(scr, (SX, SY), rmask(SW, SH, (0, 0, SW - 1, SH - 1), 34))

              # control strip: power light, slots, knobs
              d = ImageDraw.Draw(fg)
              cy = MY + MH - 42
              d.rounded_rectangle((MX + 40, cy - 22, MX + MW - 40, cy + 22), 10, fill=(70, 60, 45, 64))
              for i in range(5):
                  d.rounded_rectangle((MX + 110 + i * 22, cy - 3, MX + 124 + i * 22, cy + 3), 3, fill=(60, 50, 35, 128))
              for kx in (MX + 330, MX + 390):
                  d.ellipse((kx - 16, cy - 16, kx + 16, cy + 16), fill=(52, 47, 36, 255))
                  d.ellipse((kx - 12, cy - 13, kx + 8, cy + 7), fill=(92, 84, 68, 255))
                  d.line((kx, cy - 14, kx, cy - 6), fill=(255, 255, 255, 90), width=3)
              led = Image.new("L", (S, S), 0)
              ImageDraw.Draw(led).ellipse((MX + 58, cy - 12, MX + 82, cy + 12), fill=200)
              led = led.filter(ImageFilter.GaussianBlur(8))
              fg = Image.alpha_composite(fg, Image.merge("RGBA", (*Image.new("RGB", (S, S), BRIGHT).split(), led)))
              d = ImageDraw.Draw(fg)
              d.ellipse((MX + 62, cy - 8, MX + 78, cy + 8), fill=BRIGHT + (255,))

              # stand + keyboard
              d.rectangle((MX + 170, MY + MH - 2, MX + MW - 170, MY + MH + 24), fill=(120, 112, 92, 255))
              KX, KY, KW, KH = 330, MY + MH + 22, 364, 58
              ks = Image.new("L", (S, S), 0)
              ImageDraw.Draw(ks).rounded_rectangle((KX, KY + 8, KX + KW, KY + KH + 8), 12, fill=130)
              ks = ks.filter(ImageFilter.GaussianBlur(12))
              fg = Image.alpha_composite(fg, Image.merge("RGBA", (*Image.new("RGB", (S, S), (0, 0, 0)).split(), ks)))
              fg.paste(vgrad(KW, KH, (221, 212, 186), (165, 155, 128)), (KX, KY), rmask(KW, KH, (0, 0, KW - 1, KH - 1), 12))
              d = ImageDraw.Draw(fg)
              for r in range(3):
                  c = 0
                  while c < 13:
                      kx, ky = KX + 16 + c * 26 + (r % 2) * 8, KY + 9 + r * 15
                      if kx + 20 > KX + KW - 10:
                          break
                      w = 120 if (r == 2 and c == 4) else 20
                      d.rounded_rectangle((kx, ky, kx + w, ky + 11), 2, fill=(74, 68, 54, 255))
                      c = 9 if (r == 2 and c == 4) else c + 1
              return fg


          def build(out_dir="."):
              bg, fg = background(), terminal()
              big = fg.resize((int(S * 1.2), int(S * 1.2)), Image.LANCZOS)
              full = bg.copy()
              o = (S - big.size[0]) // 2
              full.alpha_composite(big.crop((-o, -o, -o + S, -o + S)))
              bg.save(os.path.join(out_dir, "icon-background.png"))
              fg.save(os.path.join(out_dir, "icon-foreground.png"))
              full.save(os.path.join(out_dir, "icon.png"))

          build()
          res = "android/app/src/main/res"
          dens = {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}
          fg = Image.open("icon-foreground.png").convert("RGBA")
          bg = Image.open("icon-background.png").convert("RGBA")
          full = Image.open("icon.png").convert("RGBA")
          for dn, sc in dens.items():
              folder = f"{res}/mipmap-{dn}"
              os.makedirs(folder, exist_ok=True)
              a, l = round(108 * sc), round(48 * sc)
              fg.resize((a, a), Image.LANCZOS).save(f"{folder}/ic_launcher_foreground.png")
              bg.resize((a, a), Image.LANCZOS).convert("RGB").save(f"{folder}/ic_launcher_background.png")
              icon = full.resize((l, l), Image.LANCZOS)
              icon.save(f"{folder}/ic_launcher.png")
              m = Image.new("L", (l, l), 0)
              ImageDraw.Draw(m).ellipse((0, 0, l - 1, l - 1), fill=255)
              r = Image.new("RGBA", (l, l), (0, 0, 0, 0))
              r.paste(icon, (0, 0), m)
              r.save(f"{folder}/ic_launcher_round.png")
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '  <background android:drawable="@mipmap/ic_launcher_background"/>\n'
                 '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(f"{res}/mipmap-anydpi-v26/{n}", "w") as f:
                  f.write(xml)
          print("App icon installed")
          PY

